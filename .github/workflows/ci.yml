name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workout_tracker_test
          POSTGRES_USER: workout_tracker_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workout_tracker_test -d workout_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore WorkoutTracker.slnx

      - name: Build solution
        run: dotnet build WorkoutTracker.slnx --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test WorkoutTracker.slnx --configuration Release --no-build --no-restore
        env:
          ConnectionStrings__WorkoutTrackerTest: "Host=localhost;Port=5432;Database=workout_tracker_test;Username=workout_tracker_test;Password=ci_test_password"

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/workout-tracker
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/workout-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build
